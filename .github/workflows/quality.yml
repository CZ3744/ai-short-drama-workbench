name: Studio quality
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify Python
        run: python --version
      - run: npm ci
      - run: npx playwright install chromium
      - name: Install media test tools
        run: choco install ffmpeg --no-progress -y
      - name: Verify FFmpeg
        run: ffmpeg -version
      - name: Verify FFprobe
        run: ffprobe -version
      - run: npm run build
      - run: npm test
      - run: npm run test:browser
      - run: npm run health:codebase
      - run: npm run check:privacy
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: studio-quality-evidence
          path: .quality-reports/
          retention-days: 14
